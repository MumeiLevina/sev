user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 120MB Upload Size Limit for Video & Audio Files
    client_max_body_size 120M;
    client_body_buffer_size 512k;

    # Rate Limiting: 15 requests per second per IP, burst up to 30
    limit_req_zone $binary_remote_addr zone=sub_api_limit:10m rate=15r/s;

    upstream api_service {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Healthcheck endpoint
        location /health {
            proxy_pass http://api_service/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Main API Routing with CORS and Rate Limiting
        location /api/ {
            limit_req zone=sub_api_limit burst=30 nodelay;

            # CORS Headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Location,Content-Disposition' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://api_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Extended Timeouts for Video Processing & Uploads
            proxy_connect_timeout 90s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Interactive Documentation
        location /docs {
            proxy_pass http://api_service/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api_service/openapi.json;
            proxy_set_header Host $host;
        }

        # Root service info
        location / {
            proxy_pass http://api_service/;
            proxy_set_header Host $host;
        }
    }
}
