version: '3.8'

services:
  # ------------------------------------------------------------------
  # 1. REVERSE PROXY & RATE LIMITER (NGINX)
  # ------------------------------------------------------------------
  reverse-proxy:
    image: nginx:alpine
    container_name: sub_reverse_proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - sub_network

  # ------------------------------------------------------------------
  # 2. REST API GATEWAY (FastAPI)
  # ------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sub_api
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - S3_BUCKET=${S3_BUCKET:-subtitle-uploads}
      - S3_SECURE=${S3_SECURE:-false}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-100}
      - FREE_QUOTA_SECONDS=${FREE_QUOTA_SECONDS:-3600}
      - PRO_QUOTA_SECONDS=${PRO_QUOTA_SECONDS:-36000}
      - PREMIUM_QUOTA_SECONDS=${PREMIUM_QUOTA_SECONDS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - sub_network

  # ------------------------------------------------------------------
  # 3. POSTGRESQL DATABASE
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sub_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kinetic}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kinetic_secret_2026}
      - POSTGRES_DB=${POSTGRES_DB:-subtitle_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinetic}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sub_network

  # ------------------------------------------------------------------
  # 4. REDIS MESSAGE BROKER & CACHE
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sub_network

  # ------------------------------------------------------------------
  # 5. S3-COMPATIBLE OBJECT STORAGE (MinIO)
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: sub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9002}:9001"
    networks:
      - sub_network

  # ------------------------------------------------------------------
  # 6. CELERY WORKER (Transcription Processing)
  # ------------------------------------------------------------------
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: sub_worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - S3_BUCKET=${S3_BUCKET:-subtitle-uploads}
      - S3_SECURE=${S3_SECURE:-false}
      - FREE_QUOTA_SECONDS=${FREE_QUOTA_SECONDS:-3600}
      - PRO_QUOTA_SECONDS=${PRO_QUOTA_SECONDS:-36000}
      - PREMIUM_QUOTA_SECONDS=${PREMIUM_QUOTA_SECONDS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - sub_network

networks:
  sub_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
