# ═══════════════════════════════════════════════════════════════
# Kinetic Tech — Production Nginx Master Reverse Proxy
# ═══════════════════════════════════════════════════════════════
# Handles SSL termination and routes traffic to:
#   - pdf-api.studenttools.vn  → PDF Converter Service (:8080)
#   - sub-api.studenttools.vn  → Subtitle Extractor Service (:8090)
#
# SSL certificates managed by Certbot (Let's Encrypt) or
# Cloudflare Origin Certificates.
# ═══════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Rate Limiting Zones ──
    limit_req_zone $binary_remote_addr zone=pdf_api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=sub_api_limit:10m rate=15r/s;

    # ══════════════════════════════════════════════════════════
    # SERVER: pdf-api.studenttools.vn → PDF Converter Service
    # ══════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name pdf-api.studenttools.vn;

        # SSL Certificates (replace paths with your actual cert locations)
        ssl_certificate     /etc/nginx/ssl/pdf-api.studenttools.vn.pem;
        ssl_certificate_key /etc/nginx/ssl/pdf-api.studenttools.vn.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Upload size limit for PDF files
        client_max_body_size 60M;
        client_body_buffer_size 128k;

        # Health check (no rate limit)
        location /health {
            proxy_pass http://127.0.0.1:8080/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # API routes
        location /api/ {
            limit_req zone=pdf_api_limit burst=30 nodelay;

            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Extended timeouts for large file uploads
            proxy_connect_timeout 90s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Swagger Docs
        location /docs {
            proxy_pass http://127.0.0.1:8080/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:8080/openapi.json;
            proxy_set_header Host $host;
        }

        # Block all other paths
        location / {
            return 404;
        }
    }

    # ══════════════════════════════════════════════════════════
    # SERVER: sub-api.studenttools.vn → Subtitle Service
    # ══════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name sub-api.studenttools.vn;

        # SSL Certificates
        ssl_certificate     /etc/nginx/ssl/sub-api.studenttools.vn.pem;
        ssl_certificate_key /etc/nginx/ssl/sub-api.studenttools.vn.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Upload size limit for video/audio files
        client_max_body_size 120M;
        client_body_buffer_size 512k;

        # Health check
        location /health {
            proxy_pass http://127.0.0.1:8090/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # API routes
        location /api/ {
            limit_req zone=sub_api_limit burst=30 nodelay;

            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Extended timeouts for video processing
            proxy_connect_timeout 90s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Swagger Docs
        location /docs {
            proxy_pass http://127.0.0.1:8090/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:8090/openapi.json;
            proxy_set_header Host $host;
        }

        # Root
        location / {
            proxy_pass http://127.0.0.1:8090/;
            proxy_set_header Host $host;
        }
    }

    # ══════════════════════════════════════════════════════════
    # HTTP → HTTPS Redirect (both subdomains)
    # ══════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name pdf-api.studenttools.vn sub-api.studenttools.vn;
        return 301 https://$host$request_uri;
    }
}
