# ═══════════════════════════════════════════════════════════════
# Kinetic Tech — Production Docker Compose
# ═══════════════════════════════════════════════════════════════
# Runs BOTH microservices (PDF Converter + Subtitle Extractor)
# on a single VPS server.
#
# Usage:
#   1. Copy .env.production.template → .env.production
#   2. Fill in all CHANGE_ME values
#   3. Run: docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# Scale workers:
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --scale pdf-worker=4
# ═══════════════════════════════════════════════════════════════

services:

  # ──────────────────────────────────────────────────────────
  #  PDF CONVERTER SERVICE
  # ──────────────────────────────────────────────────────────

  # PDF: Nginx Reverse Proxy
  pdf-proxy:
    image: nginx:alpine
    container_name: prod_pdf_proxy
    restart: unless-stopped
    ports:
      - "${PDF_HTTP_PORT:-8080}:80"
    volumes:
      - ../pdf-converter-service/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pdf-api
    networks:
      - pdf_network

  # PDF: FastAPI Gateway
  pdf-api:
    build:
      context: ../pdf-converter-service/api
      dockerfile: Dockerfile
    container_name: prod_pdf_api
    restart: unless-stopped
    environment:
      - PORT=8000
      - REDIS_URL=${PDF_REDIS_URL:-redis://pdf-redis:6379/0}
      - S3_ENDPOINT=http://pdf-minio:9000
      - S3_ACCESS_KEY=${PDF_S3_ACCESS_KEY}
      - S3_SECRET_KEY=${PDF_S3_SECRET_KEY}
      - S3_BUCKET=${PDF_S3_BUCKET:-pdf-conversions}
      - MAX_UPLOAD_SIZE_MB=${PDF_MAX_UPLOAD_SIZE_MB:-50}
      - ALLOWED_ORIGINS=https://studenttools.vn,https://www.studenttools.vn
    depends_on:
      - pdf-redis
      - pdf-minio
    networks:
      - pdf_network

  # PDF: Redis
  pdf-redis:
    image: redis:7-alpine
    container_name: prod_pdf_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - pdf_redis_data:/data
    networks:
      - pdf_network

  # PDF: MinIO S3 Storage
  pdf-minio:
    image: minio/minio:latest
    container_name: prod_pdf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${PDF_S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${PDF_S3_SECRET_KEY}
    volumes:
      - pdf_minio_data:/data
    networks:
      - pdf_network
    # MinIO console NOT exposed to public — access via SSH tunnel if needed

  # PDF: LibreOffice unoserver
  pdf-unoserver:
    image: ghcr.io/unoconv/unoserver-docker:latest
    container_name: prod_pdf_unoserver
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - pdf_network

  # PDF: Celery Worker(s)
  pdf-worker:
    build:
      context: ../pdf-converter-service/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    tmpfs:
      - /dev/shm:size=512M
    environment:
      - REDIS_URL=${PDF_REDIS_URL:-redis://pdf-redis:6379/0}
      - S3_ENDPOINT=http://pdf-minio:9000
      - S3_ACCESS_KEY=${PDF_S3_ACCESS_KEY}
      - S3_SECRET_KEY=${PDF_S3_SECRET_KEY}
      - S3_BUCKET=${PDF_S3_BUCKET:-pdf-conversions}
      - UNOSERVER_HOST=pdf-unoserver
      - UNOSERVER_PORT=2003
      - CONCURRENCY=${PDF_WORKER_CONCURRENCY:-2}
    depends_on:
      - pdf-redis
      - pdf-minio
      - pdf-unoserver
    networks:
      - pdf_network

  # ──────────────────────────────────────────────────────────
  #  SUBTITLE EXTRACTOR SERVICE
  # ──────────────────────────────────────────────────────────

  # Subtitle: Nginx Reverse Proxy
  sub-proxy:
    image: nginx:alpine
    container_name: prod_sub_proxy
    restart: unless-stopped
    ports:
      - "${SUB_HTTP_PORT:-8090}:80"
    volumes:
      - ../subtitle-service/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sub-api
    networks:
      - sub_network

  # Subtitle: FastAPI Gateway
  sub-api:
    build:
      context: ../subtitle-service/api
      dockerfile: Dockerfile
    container_name: prod_sub_api
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://${SUB_POSTGRES_USER}:${SUB_POSTGRES_PASSWORD}@sub-postgres:5432/${SUB_POSTGRES_DB}
      - REDIS_URL=${SUB_REDIS_URL:-redis://sub-redis:6379/0}
      - OPENAI_API_KEY=${SUB_OPENAI_API_KEY}
      - JWT_SECRET_KEY=${SUB_JWT_SECRET_KEY}
      - JWT_ALGORITHM=${SUB_JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${SUB_JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${SUB_JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - GOOGLE_CLIENT_ID=${SUB_GOOGLE_CLIENT_ID:-}
      - S3_ENDPOINT=http://sub-minio:9000
      - S3_ACCESS_KEY=${SUB_S3_ACCESS_KEY}
      - S3_SECRET_KEY=${SUB_S3_SECRET_KEY}
      - S3_BUCKET=${SUB_S3_BUCKET:-subtitle-uploads}
      - S3_SECURE=false
      - MAX_UPLOAD_SIZE_MB=${SUB_MAX_UPLOAD_SIZE_MB:-100}
      - FREE_QUOTA_SECONDS=${SUB_FREE_QUOTA_SECONDS:-3600}
      - PRO_QUOTA_SECONDS=${SUB_PRO_QUOTA_SECONDS:-36000}
      - PREMIUM_QUOTA_SECONDS=${SUB_PREMIUM_QUOTA_SECONDS:-0}
      - ALLOWED_ORIGINS=https://studenttools.vn,https://www.studenttools.vn
    depends_on:
      sub-postgres:
        condition: service_healthy
      sub-redis:
        condition: service_healthy
      sub-minio:
        condition: service_started
    networks:
      - sub_network

  # Subtitle: PostgreSQL
  sub-postgres:
    image: postgres:16-alpine
    container_name: prod_sub_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SUB_POSTGRES_USER}
      - POSTGRES_PASSWORD=${SUB_POSTGRES_PASSWORD}
      - POSTGRES_DB=${SUB_POSTGRES_DB:-subtitle_service}
    volumes:
      - sub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUB_POSTGRES_USER:-kinetic_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sub_network

  # Subtitle: Redis
  sub-redis:
    image: redis:7-alpine
    container_name: prod_sub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - sub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sub_network

  # Subtitle: MinIO S3 Storage
  sub-minio:
    image: minio/minio:latest
    container_name: prod_sub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${SUB_S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${SUB_S3_SECRET_KEY}
    volumes:
      - sub_minio_data:/data
    networks:
      - sub_network
    # MinIO console NOT exposed to public

  # Subtitle: Celery Worker
  sub-worker:
    build:
      context: ../subtitle-service/worker
      dockerfile: Dockerfile
    container_name: prod_sub_worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    environment:
      - DATABASE_URL=postgresql://${SUB_POSTGRES_USER}:${SUB_POSTGRES_PASSWORD}@sub-postgres:5432/${SUB_POSTGRES_DB}
      - REDIS_URL=${SUB_REDIS_URL:-redis://sub-redis:6379/0}
      - OPENAI_API_KEY=${SUB_OPENAI_API_KEY}
      - S3_ENDPOINT=http://sub-minio:9000
      - S3_ACCESS_KEY=${SUB_S3_ACCESS_KEY}
      - S3_SECRET_KEY=${SUB_S3_SECRET_KEY}
      - S3_BUCKET=${SUB_S3_BUCKET:-subtitle-uploads}
      - S3_SECURE=false
      - FREE_QUOTA_SECONDS=${SUB_FREE_QUOTA_SECONDS:-3600}
      - PRO_QUOTA_SECONDS=${SUB_PRO_QUOTA_SECONDS:-36000}
      - PREMIUM_QUOTA_SECONDS=${SUB_PREMIUM_QUOTA_SECONDS:-0}
    depends_on:
      sub-postgres:
        condition: service_healthy
      sub-redis:
        condition: service_healthy
      sub-minio:
        condition: service_started
    networks:
      - sub_network

# ──────────────────────────────────────────────────────────
#  NETWORKS & VOLUMES
# ──────────────────────────────────────────────────────────
networks:
  pdf_network:
    driver: bridge
  sub_network:
    driver: bridge

volumes:
  pdf_redis_data:
  pdf_minio_data:
  sub_postgres_data:
  sub_redis_data:
  sub_minio_data:
