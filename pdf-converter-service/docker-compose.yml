version: '3.8'

services:
  # ------------------------------------------------------------------
  # 1. REVERSE PROXY & RATE LIMITER (NGINX)
  # ------------------------------------------------------------------
  reverse-proxy:
    image: nginx:alpine
    container_name: pdf_reverse_proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - pdf_network

  # ------------------------------------------------------------------
  # 2. REST API GATEWAY SERVICE (FastAPI)
  # ------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pdf_api_gateway
    restart: unless-stopped
    environment:
      - PORT=8000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - S3_BUCKET=${S3_BUCKET:-pdf-conversions}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
    depends_on:
      - redis
      - minio
    networks:
      - pdf_network

  # ------------------------------------------------------------------
  # 3. MESSAGE BROKER & TASK QUEUE (Redis)
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pdf_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - pdf_network

  # ------------------------------------------------------------------
  # 4. S3-COMPATIBLE TEMPORARY OBJECT STORAGE (MinIO)
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: pdf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - pdf_network

  # ------------------------------------------------------------------
  # 5. LIBREOFFICE DAEMON LISTENER (unoserver)
  # ------------------------------------------------------------------
  unoserver:
    image: ghcr.io/unoconv/unoserver-docker:latest
    container_name: pdf_unoserver
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - pdf_network

  # ------------------------------------------------------------------
  # 6. WORKER NODES (Celery Consumer Engines)
  # ------------------------------------------------------------------
  worker-converter:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    tmpfs:
      - /dev/shm:size=512M
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - S3_BUCKET=${S3_BUCKET:-pdf-conversions}
      - UNOSERVER_HOST=unoserver
      - UNOSERVER_PORT=2003
      - CONCURRENCY=2
    depends_on:
      - redis
      - minio
      - unoserver
    networks:
      - pdf_network

networks:
  pdf_network:
    driver: bridge

volumes:
  redis_data:
  minio_data:
